<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wanareksa — Earth Observation & Peatland Sentinel | NASA Space Apps Challenge 2026</title>
    <meta name="description" content="Wanareksa: Cross-sensor harmonization of MODIS and VIIRS satellite active fire hotspots for tropical peatland protection across Indonesia." />
    <!-- Fonts (Non-render-blocking high performance load) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap">
    </noscript>
    <!-- Theme Detection (Instant System & Preference Sync) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('wanareksa_theme');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && systemDark)) {
            document.documentElement.classList.add('dark');
            if (document.body) document.body.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
            if (document.body) document.body.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#f5f5f7] dark:bg-[#0b0f19] text-[#1d1d1f] dark:text-[#f3f4f6] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
