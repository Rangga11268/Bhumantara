<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>WANAREKSA App Icon</title>
  <!-- Rounded Rect App Icon Background (Apple Squircle / NASA Dark Canvas) -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="#08101E" />
  
  <!-- Planetary Disc -->
  <circle cx="128" cy="128" r="98" fill="#0B3D91" />
  <circle cx="128" cy="128" r="98" fill="none" stroke="#38BDF8" stroke-width="2.5" />

  <!-- Biosphere Horizon -->
  <path d="M 42,148 A 98,98 0 0 0 214,148 C 174,178 82,178 42,148 Z" fill="#059669" />

  <!-- NASA Orbit Trajectory -->
  <ellipse cx="128" cy="128" rx="96" ry="30" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-dasharray="120 18" transform="rotate(-28 128 128)" />

  <!-- Supersonic Chevron 'W' -->
  <polygon points="68,158 100,74 128,134 110,144 100,116 82,158" fill="#FFFFFF" />
  <polygon points="188,158 156,74 128,134 146,144 156,116 174,158" fill="#FC3D21" />
  <polygon points="128,84 140,118 128,134 116,118" fill="#FFFFFF" />

  <!-- Thermal Node -->
  <circle cx="128" cy="84" r="8.5" fill="#FC3D21" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="128" cy="84" r="4" fill="#FDE047" />

  <!-- Transponder -->
  <circle cx="204" cy="86" r="5" fill="#FFFFFF" />
</svg>